# Vue SPA + API gateway for lab 3.
# Proxy paths are intentionally unchanged so the original Vue API calls work.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Client-facing endpoints ONLY. /internal/ remains unreachable via this gateway.
    # Keep the original request URI, including its /api/ prefix and query string.
    location ^~ /api/products/     { proxy_pass http://catalog:8000; include /etc/nginx/proxy_params_lab3; }
    location ^~ /api/categories/   { proxy_pass http://catalog:8000; include /etc/nginx/proxy_params_lab3; }

    location ^~ /api/orders/       { proxy_pass http://orders:8000;  include /etc/nginx/proxy_params_lab3; }
    location ^~ /api/orderDetails/ { proxy_pass http://orders:8000;  include /etc/nginx/proxy_params_lab3; }

    location ^~ /api/customers/    { proxy_pass http://users:8000;   include /etc/nginx/proxy_params_lab3; }
    location ^~ /api/users/        { proxy_pass http://users:8000;   include /etc/nginx/proxy_params_lab3; }
    location ^~ /api/login/        { proxy_pass http://users:8000;   include /etc/nginx/proxy_params_lab3; }
    location ^~ /api/register/     { proxy_pass http://users:8000;   include /etc/nginx/proxy_params_lab3; }

    # Images are uploaded to two different backend-owned Docker volumes.
    # Access through nginx keeps both URLs on the same origin as the Vue app.
    location ^~ /media/products/  { alias /srv/media/catalog/products/; }
    location ^~ /media/customers/ { alias /srv/media/users/customers/; }

    # Unknown API routes must not fall back to the SPA's index.html.
    location ^~ /api/ { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /media/ { return 404; }

    # Vue Router's history mode requires falling back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
