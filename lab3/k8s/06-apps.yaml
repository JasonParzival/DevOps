# Все 4 сервиса по 2 реплики. Внутренние DNS-имена совпадают с Docker Compose.
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: lab3
spec:
  selector:
    app: users
  ports:
  - port: 8000
    targetPort: 8000
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: lab3
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
      - name: users
        image: lab3-users:k8s-v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: lab3-common
        env:
        - name: POSTGRES_DB
          value: users_db
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lab3-secrets
              key: POSTGRES_PASSWORD
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: lab3-secrets
              key: DJANGO_USERS_SECRET_KEY
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: lab3-secrets
              key: INTERNAL_API_KEY
        - name: ORDERS_SERVICE_URL
          value: http://orders:8000
        readinessProbe:
          httpGet:
            path: /health/ready/
            port: 8000
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health/live/
            port: 8000
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 35m
            memory: 96Mi
          limits:
            cpu: 450m
            memory: 512Mi
        volumeMounts:
        - name: media
          mountPath: /app/media
      volumes:
      - name: media
        persistentVolumeClaim:
          claimName: users-media
---
